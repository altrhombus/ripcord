name: CI

on:
  push:
    branches: [main]
    # The PS3 port versions independently of the Windows client, so it has its own tag namespace and
    # ps3-v1.0 is a claim about the port alone. A tag push runs this whole file, not a reduced release
    # pipeline: a release that has not passed the same checks as a pull request is a weaker artifact than
    # the pull request was.
    tags: ['ps3-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The real gate. Both suites are plain net10.0 and need no console, GPU, native interop or
  # Windows-only hardware, so this job is fast and should never be flaky. A clean checkout has no
  # dirty room, so the capture-backed vector tests self-skip — that is by design, and the skip
  # count going UP unexpectedly is worth a look, since it means a test stopped finding its fixture.
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      # fetch-depth: 0, deliberately. PublishedTreeSweepTests sweeps every commit message, and
      # actions/checkout defaults to a depth-1 clone in which `git log` returns one commit and
      # exits 0 — indistinguishable from a single-commit repository. The sweep would report clean
      # having read 1 of N messages. The suite now fails on a shallow clone rather than pass
      # quietly, so removing this line turns the job red instead of hollowing the guard out.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test — protocol
        run: dotnet test tests/Ripcord.Protocol.Halyard.Tests/Ripcord.Protocol.Halyard.Tests.csproj -c Release --logger "console;verbosity=normal"
      - name: Test — presentation
        run: dotnet test tests/Ripcord.Presentation.Tests/Ripcord.Presentation.Tests.csproj -c Release --logger "console;verbosity=normal"

  # The full app, including the two C++/WinRT projects. `dotnet build` cannot build a vcxproj at
  # all, so this needs MSBuild proper. Both architectures are first-class targets and either can
  # regress alone — ARM64 has caught real breaks that x64 did not.
  app:
    name: App (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: microsoft/setup-msbuild@v2
        with:
          # The action defaults to the 32-bit MSBuild.exe. Directory.Build.props' own error text tells
          # you to "use the one matching the machine" for exactly this reason: a 32-bit MSBuild makes any
          # property derived from the process architecture answer x86. The csproj no longer asks that
          # question, so this is belt-and-braces rather than the fix - but a 64-bit MSBuild is what these
          # projects are meant to be driven by.
          msbuild-architecture: x64
      - name: Build solution
        # -restore, not a bare build. Without it every managed project fails NETSDK1004 looking for a
        # project.assets.json that no step has produced - which is what every App job did until someone
        # read a CI log.
        #
        # -p:RipcordNativePlatform is the documented escape hatch for a cross-architecture build, and this
        # is one: an x64 runner producing ARM64. A solution build hands -p:Platform only to projects that
        # declare <Platforms>, so the AnyCPU managed consumers (Ripcord.Media, Ripcord.Input) see
        # Platform=AnyCPU, fall to the last rule in Directory.Build.props - the machine's OSArchitecture -
        # and look for their native interop under x64\Release while the C++ projects correctly wrote it to
        # ARM64\Release. The native half built perfectly; the managed half looked in the wrong directory
        # and failed with a hundred CS0246s naming types that were sitting right there.
        run: msbuild Ripcord.slnx -restore -p:Platform=${{ matrix.platform }} -p:RipcordNativePlatform=${{ matrix.platform }} -p:Configuration=Release -m
      - name: Native interop landed where the managed projects look for it
        shell: pwsh
        run: |
          $dir = "${{ matrix.platform }}\Release"
          if (-not (Test-Path $dir)) { throw "native interop output missing: $dir" }
          Get-ChildItem $dir -Recurse -Filter *.dll | Select-Object -First 20 Name, Length

  # NOT a support claim: the shipping UI is Windows-only and there is no macOS or Linux front end.
  # This guards one rule — that the 15 portable projects stay portable. `Ripcord.Presentation` is
  # policed by PresentationPortabilityTests reflecting over assembly references, but a project
  # picking up a Windows-only *package* would slip past that and only surface whenever someone
  # finally tried another platform. Compiling the portable set for a non-Windows RID catches it on
  # the commit that causes it, and costs one job. Delete this block if the guard is not wanted.
  portable-core:
    name: Portable core (${{ matrix.rid }})
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, rid: linux-x64 }
          - { host: macos-latest,  rid: osx-arm64 }
    steps:
      # fetch-depth: 0, deliberately. PublishedTreeSweepTests sweeps every commit message, and
      # actions/checkout defaults to a depth-1 clone in which `git log` returns one commit and
      # exits 0 — indistinguishable from a single-commit repository. The sweep would report clean
      # having read 1 of N messages. The suite now fails on a shallow clone rather than pass
      # quietly, so removing this line turns the job red instead of hollowing the guard out.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build the portable projects
        run: |
          for p in \
            src/Ripcord.Core/Ripcord.Core.csproj \
            src/Ripcord.Core.Net/Ripcord.Core.Net.csproj \
            src/Ripcord.Cloud.Halyard/Ripcord.Cloud.Halyard.csproj \
            src/Ripcord.Protocol.Halyard.Common/Ripcord.Protocol.Halyard.Common.csproj \
            src/Ripcord.Protocol.Halyard.Takion/Ripcord.Protocol.Halyard.Takion.csproj \
            src/Ripcord.Protocol.Halyard/Ripcord.Protocol.Halyard.csproj \
            src/Ripcord.Presentation/Ripcord.Presentation.csproj \
            src/Ripcord.Presentation.Halyard/Ripcord.Presentation.Halyard.csproj \
            src/Ripcord.Client/Ripcord.Client.csproj \
            src/Ripcord.Diagnostics/Ripcord.Diagnostics.csproj \
            src/Ripcord.Media.Audio/Ripcord.Media.Audio.csproj \
            src/Ripcord.Input.Common/Ripcord.Input.Common.csproj \
            tools/Ripcord.ProtocolLab/Ripcord.ProtocolLab.csproj ; do
            echo "== $p"
            dotnet build "$p" -c Release -r ${{ matrix.rid }} --self-contained false
          done
      - name: Run both suites on this host
        run: |
          dotnet test tests/Ripcord.Protocol.Halyard.Tests/Ripcord.Protocol.Halyard.Tests.csproj -c Release
          dotnet test tests/Ripcord.Presentation.Tests/Ripcord.Presentation.Tests.csproj -c Release

  # The PS3 port's installable package. Not in Ripcord.slnx and buildable by neither dotnet nor
  # MSBuild - it is a Makefile driving a PowerPC cross-compiler plus a second one for the SPEs - so it
  # gets its own job rather than a leg on one of the matrices above.
  #
  # THE PACKAGE, NOT THE .self, AND THAT IS THE POINT. A plain `make` gives ripcord-ps3.self, which is
  # what ps3load sends to a console over the network. `make pkg` is what installs from the XMB, which
  # is what somebody who is not developing this port actually wants - and it covers strictly more of
  # the build: make_self_npdrm, the icon, PARAM.SFO and the third-party notices are all pkg-only
  # steps. ports/ripcord-ps3/SETUP.md section 6 is the post-mortem of four hardware runs that produced
  # no output at all, and both causes were in the packaging rather than in the program.
  #
  # NOT PATH-FILTERED, deliberately. A per-job `paths:` needs either its own workflow file or a
  # third-party filter action, and the second is not something this repository takes - but the
  # honest reason is that the filter would be wrong anyway. This build consumes ports/common/** and
  # src/Ripcord.Protocol.Halyard/Data/halyard-v1-constants.json, so a change under src/ really can
  # break it, and "the PS3 job only runs when PS3 files change" is how that stays unnoticed.
  ps3-package:
    name: PS3 package
    runs-on: ubuntu-latest
    env:
      # The toolchain this port is verified against. ports/ripcord-ps3/SETUP.md section 2 names the
      # same nightly and the two are meant to agree - bump them together, with a hardware run behind
      # the bump. Pinned rather than tracking the newest because ps3dev cuts nightlies on its own
      # schedule, and a green build going red for a reason nobody in this repository chose is the
      # fastest way to teach people to ignore a red build.
      PS3DEV_RELEASE: nightly-2026-07-26
    steps:
      - uses: actions/checkout@v4

      # 180 MB compressed, 577 MB unpacked, and nothing in it depends on anything in this repository -
      # so the release tag is the whole cache key. Kept in $HOME rather than the workspace: the
      # archive is relocatable (SETUP.md section 2), and an unpacked toolchain inside the checkout is
      # 577 MB of untracked files sitting in a tree other jobs make assertions about.
      - name: Cache the ps3dev toolchain
        id: ps3dev
        uses: actions/cache@v4
        with:
          path: ~/ps3dev
          key: ps3dev-${{ env.PS3DEV_RELEASE }}

      - name: Install the ps3dev toolchain
        if: steps.ps3dev.outputs.cache-hit != 'true'
        run: |
          curl -sSL --retry 3 -o "$RUNNER_TEMP/ps3dev.tar.gz" \
            "https://github.com/ps3dev/ps3dev/releases/download/$PS3DEV_RELEASE/ps3dev-linux-X64.tar.gz"
          tar xzf "$RUNNER_TEMP/ps3dev.tar.gz" -C "$HOME"    # the archive's top level is ps3dev/

      # PSL1GHT IS PS3DEV, not $PS3DEV/psl1ght. The archive puts ppu_rules, base_rules and data_rules
      # at the top level beside ppu/ and spu/, and ppu_rules resolves -I$(PSL1GHT)/ppu/include against
      # that. SETUP.md section 2 records the same correction, which an earlier revision of it got
      # wrong. The Makefiles hard-error on either variable being unset, so there is no silent wrong
      # answer available - but there is a silently wrong directory, which is this one.
      #
      # The Makefile addresses the compilers by absolute path; PATH is here for build-mbedtls.sh,
      # which resolves ${CROSS}gcc with `command -v` and exits rather than build if it is not there.
      - name: Point the build at the toolchain
        run: |
          echo "PS3DEV=$HOME/ps3dev"  >> "$GITHUB_ENV"
          echo "PSL1GHT=$HOME/ps3dev" >> "$GITHUB_ENV"
          printf '%s\n' "$HOME/ps3dev/bin" "$HOME/ps3dev/ppu/bin" "$HOME/ps3dev/spu/bin" >> "$GITHUB_PATH"

      # openh264, Opus and Mbed TLS are fetched from pinned, hash-verified upstream releases and
      # cross-built; none is vendored, which is why this is a build step at all and not a checkout.
      # The key covers the three scripts and the Mbed TLS config header because those are the only
      # things in this repository that decide what comes out, plus the toolchain that compiled it.
      - name: Cache the cross-built third-party libraries
        id: thirdparty
        uses: actions/cache@v4
        with:
          path: ports/ripcord-ps3/third-party
          key: ps3-thirdparty-${{ env.PS3DEV_RELEASE }}-${{ hashFiles('ports/ripcord-ps3/tools/build-openh264.sh', 'ports/ripcord-ps3/tools/build-opus.sh', 'ports/common/tools/build-mbedtls.sh', 'ports/common/tools/ripcord-mbedtls-config.h') }}

      # SKIPPED ON A CACHE HIT rather than left to short-circuit itself. build-mbedtls.sh does check
      # whether its output is up to date; build-openh264.sh does not - it clears obj/ and recompiles
      # all 35 translation units every time it runs. Since the cache key covers the scripts, a hit
      # means the libraries in it were produced by exactly these scripts and this toolchain, so
      # running them again buys nothing but minutes.
      - name: Cross-build openh264, Opus and Mbed TLS
        if: steps.thirdparty.outputs.cache-hit != 'true'
        working-directory: ports/ripcord-ps3
        run: |
          sh tools/build-openh264.sh
          sh tools/build-opus.sh
          PREFIX="$PWD/third-party/mbedtls" CROSS=powerpc64-ps3-elf- sh ../common/tools/build-mbedtls.sh

      # THE BUILD NUMBER IS THE RUN NUMBER, and this is not decoration. The Makefile explains at
      # length why every build gets an id: for five hardware runs the only evidence of WHICH binary
      # had executed was the byte size of the installed EBOOT, and a stale install and a broken
      # program look identical. .buildno is gitignored per-machine state, so a runner starts at zero
      # and every package CI ever produced would otherwise call itself b1.
      #
      # One less than the run number, because the rc_build_id.h rule increments what it reads - so
      # the package comes out stamped with the run that made it, and the XMB version is that number
      # with a dot in it (run 432 -> 04.32). The Makefile's ceiling applies here too: the NN.NN
      # version field holds to b9999, and run 10000 would produce a version this console will not
      # parse. That is years away and it is written down rather than guarded.
      # ON A TAG THE PACKAGE IS VERSIONED BY THE TAG AND NOT BY EITHER COUNTER, because a person installing
      # a release is asking "which version is this" and a counter answers "which iteration is this" - a
      # question about the machine that built it. RELEASE_TAG goes into the environment, which is where the
      # Makefile's `RELEASE_TAG ?=` reads it from, and the developer counter is not consumed at all.
      - name: Decide how this build is versioned
        run: |
          case "$GITHUB_REF" in
            refs/tags/ps3-v*)
              echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
              echo "release build, versioned by tag $GITHUB_REF_NAME" ;;
            *)
              echo "ordinary build, versioned by run number ${{ github.run_number }}" ;;
          esac

      - name: Stamp the package with this run's number
        if: env.RELEASE_TAG == ''
        run: echo $(( ${{ github.run_number }} - 1 )) > ports/ripcord-ps3/.buildno

      # BOTH GOALS, and `pkg` alone is not enough. The pkg rule depends on build/ripcord-ps3.ready.elf
      # and stops there - it never reaches the $(APP).self rule, so on a clean checkout (*.self is
      # gitignored) `make pkg` leaves no .self behind at all and the upload below fails looking for
      # one. One invocation rather than two so both goals share a single rc_build_id.h and the package
      # cannot end up stamped differently from the .self beside it.
      # BUILD_ORIGIN=ci, so the compiled build id is "b35ci" and no CI artifact can be mistaken for a
      # developer build. The two counters are independent - this one is github.run_number, the other is a
      # gitignored per-machine file - and both printed the same "bNNN" shape until now. The docs cite 94
      # local build numbers between b87 and b428; CI was days from reaching that range and minting a
      # second, different b87.
      - name: Build the package
        working-directory: ports/ripcord-ps3
        run: make all pkg BUILD_ORIGIN=ci

      # THE PACKAGE HAS TO PROVE IT CARRIES THE BUILD THAT WAS JUST MADE. This is tools/ship.sh's
      # check, which exists because `make pkg` leaves the previous package in place when it fails:
      # three builds in a row reported a new build number, uploaded cleanly, installed cleanly and
      # ran the old binary. An artifact download is an upload by another name, so it gets the same
      # gate. The notices check is the other half - a .pkg that ships without them is a licence
      # breach, and the Makefile makes them a prerequisite precisely so this can be asserted.
      - name: The package carries the build that was just made
        working-directory: ports/ripcord-ps3
        run: |
          sfo_ver=$(strings build/pkg/PARAM.SFO | grep -oE '^[0-9][0-9]\.[0-9][0-9]$' | head -1)

          if [ -n "$RELEASE_TAG" ]; then
            # A RELEASE IS CHECKED AGAINST ITS TAG, which is the only thing that can be wrong about it:
            # the package must claim the version the tag names. ps3-v1.0 -> 01.00.
            expected=$(printf '%s' "$RELEASE_TAG" \
              | sed -n 's/^ps3-v\([0-9][0-9]*\)\.\([0-9][0-9]*\)$/\1 \2/p' \
              | xargs printf '%02d.%02d')
            if [ -z "$expected" ] || [ "$sfo_ver" != "$expected" ]; then
              echo "::error::tag $RELEASE_TAG wants version $expected but the package says ${sfo_ver:-nothing}"
              exit 1
            fi
            echo "$RELEASE_TAG, version $sfo_ver - EBOOT, icon and notices all present"
          else
            # [a-z]* tolerates the BUILD_ORIGIN suffix this job passes - the id is "b35ci", not "b35".
            # Without it the pattern matches nothing and this gate fails every CI build while reporting a
            # stale package, which is the misdiagnosis it exists to avoid rather than cause.
            built=$(sed -n 's/.*"b\([0-9]*\)[a-z]*".*/\1/p' build/rc_build_id.h)
            sfo_built=$(printf '%s' "$sfo_ver" | tr -d '.' | sed 's/^0*//')

            if [ -z "$built" ] || [ "$built" != "$sfo_built" ]; then
              echo "::error::compiled b$built but the package's version says ${sfo_ver:-nothing} - the package is stale"
              exit 1
            fi
          fi
          for f in build/pkg/USRDIR/EBOOT.BIN build/pkg/USRDIR/THIRD-PARTY-NOTICES.txt build/pkg/ICON0.PNG; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty in the package staging directory"; exit 1; }
          done
          [ -n "$RELEASE_TAG" ] || echo "b$built, version $sfo_ver - EBOOT, icon and notices all present"
          ls -l ripcord-ps3.gnpdrm.pkg

      # BOTH PACKAGES, because they are not interchangeable and which one a console wants depends on
      # how it is set up. tools/ship.sh uploads the .gnpdrm one - that is the package_finalize'd
      # build and the one that has actually been installed on hardware. The .self is here because it
      # is what ps3load takes, which is the fast loop SETUP.md section 6 argues for.
      #
      # THE PACKAGE, AND ONLY THE PACKAGE. It is the file a person wants - it installs from the XMB and
      # appears on the console - and it is self-sufficient, carrying USRDIR/THIRD-PARTY-NOTICES.txt
      # inside itself, which is where the licences want it for a binary distribution.
      #
      # The .self used to ship here too and no longer does, which settles a licence question rather than
      # trimming a download. A .self is a bare executable with no container: `strings` finds no notice
      # text in it, and it links openh264, Opus, Mbed TLS, PSL1GHT and FreeType statically. Publishing
      # one means publishing the notices beside it and relying on whoever downloads it to take both. Not
      # publishing it removes the question instead of answering it, and costs nothing - a .self is a
      # local build product for ps3load, and anyone who wants one runs `make`.
      #
      # The .gnpdrm one rather than the plain .pkg: it is what tools/ship.sh uploads, what SETUP.md's
      # loop installs, and what has been installed on hardware. The plain .pkg also installs and can
      # come back if a reason appears; one file is a better default than two that differ in a header
      # byte and an encryption key.
      - uses: actions/upload-artifact@v4
        with:
          name: ripcord-ps3-b${{ github.run_number }}
          path: ports/ripcord-ps3/ripcord-ps3.gnpdrm.pkg
          if-no-files-found: error

  # THE RELEASE. Runs only for a ps3-v* tag, and only after everything else in this file has passed -
  # including the two suites, both App architectures and both portable-core hosts. A release that skipped
  # the checks a pull request has to pass would be a weaker artifact than the pull request was.
  #
  # IT BUILDS NOTHING. The package it publishes is the one ps3-package already built and verified against
  # the tag, downloaded as that job's artifact. A release that rebuilds is a release nothing has checked -
  # the bytes a person installs would be bytes no gate ever saw.
  #
  # A DRAFT, DELIBERATELY. The workflow attaches the package and writes nothing about what it does; a human
  # publishes it, having written release notes that say what this port streams and what it does not. An
  # automated release is an outward-facing act taken without anybody reading it, and this project's notes
  # are the place its limits get stated honestly.
  ps3-release:
    name: PS3 release
    if: startsWith(github.ref, 'refs/tags/ps3-v')
    # Deliberately not `dco`: it is pull-request-only, so on a tag it is skipped, and a skipped dependency
    # skips its dependents.
    needs: [tests, app, portable-core, ps3-package]
    runs-on: ubuntu-latest
    permissions:
      # The only job in this file that writes anything back. The workflow's default is contents: read.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ripcord-ps3-b${{ github.run_number }}
          path: dist

      # THE ASSET CARRIES THE VERSION IN ITS NAME, because a file called ripcord-ps3.gnpdrm.pkg in a
      # downloads folder beside three others is unidentifiable. The console does not care what the package
      # is called - only EBOOT.BIN's name matters to NPDRM - so this is free.
      - name: Publish a draft release with the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ${GITHUB_REF_NAME#ps3-} drops the namespace prefix, so ps3-v0.9 gives ripcord-ps3-v0.9.pkg
          # rather than ripcord-ps3-ps3-v0.9.pkg. The prefix exists to keep the tag namespace separate
          # from the Windows client's; it has no business appearing twice in a filename.
          asset="ripcord-ps3-${GITHUB_REF_NAME#ps3-}.pkg"
          mv dist/ripcord-ps3.gnpdrm.pkg "$asset"
          ls -l "$asset"

          # The notes are a placeholder on purpose. What this port streams, and what it does not, is a
          # judgement a person makes and writes before publishing - not something a workflow asserts.
          cat > notes.md <<'NOTES'
          **Draft — release notes go here before publishing.** What this build runs, streams and pairs
          with, and what it does not do.

          The package installs from the XMB. It carries its own third-party notices inside itself at
          `USRDIR/THIRD-PARTY-NOTICES.txt`.
          NOTES
          sed -i 's/^          //' notes.md

          # -R, because this job has no checkout and does not want one. `gh` infers the repository from a
          # git remote, and the first run of this job died on "fatal: not a git repository" after doing
          # everything else correctly - the asset was built, named and sitting there. Checking out the
          # source purely to satisfy that inference would contradict the reason the job builds nothing.
          gh release create "$GITHUB_REF_NAME" "$asset" \
            -R "$GITHUB_REPOSITORY" \
            --draft \
            --title "ripcord-ps3 $GITHUB_REF_NAME" \
            --notes-file notes.md

          echo "Draft release $GITHUB_REF_NAME created with $asset attached."
          echo "It is NOT public until somebody publishes it."

  # CONTRIBUTING.md section 1 requires every commit to carry a Signed-off-by line matching its
  # author. Until now the only thing enforcing that was a checkbox in the pull-request template,
  # and a checkbox is not a mechanism: feat/ps3-port reached 260 unsigned commits out of 308
  # before anybody noticed, on a repository whose main branch is otherwise entirely signed. That
  # is what an unenforced rule costs, and it is the same shape as every other guard here - the
  # rule existed, nothing asked it.
  #
  # Deliberately a few lines of git rather than a third-party action. This repository takes only
  # first-party actions, and "does each commit in this range carry a trailer" does not justify a
  # supply-chain dependency on somebody else's.
  dco:
    name: DCO sign-off
    # Pull requests only. On a push to main the range worth checking is ambiguous, and by then the
    # check is a report rather than a gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 for the same reason the other jobs need it: the commits being judged are
      # exactly the ones a shallow clone does not have, and `git rev-list` over a range it cannot
      # see exits 0 having checked nothing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its own author
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'

          # --no-merges: a merge commit introduces no new work to certify, and the one the forge
          # writes for you cannot have been signed by anybody in advance. The DCO is about
          # authorship, so it is asked of commits that carry authored work.
          commits="$(git rev-list --no-merges "$base..$head")"
          if [ -z "$commits" ]; then
            echo "No non-merge commits in $base..$head - nothing to certify."
            exit 0
          fi

          fail=0
          checked=0
          for sha in $commits; do
            checked=$((checked + 1))
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            signoffs="$(git log -1 --format='%B' "$sha" | sed -n 's/^[Ss]igned-off-by:[[:space:]]*//p' | sed 's/[[:space:]]*$//')"

            # -x and -i: the whole line must be the author, not merely contain them, so a sign-off
            # naming somebody else does not pass simply by being present.
            if echo "$signoffs" | grep -qixF "$author"; then
              continue
            fi

            echo "::error title=Missing or mismatched DCO sign-off::$(git log -1 --format='%h %s' "$sha")"
            echo "    author:    $author"
            echo "    sign-offs: ${signoffs:-(none)}"
            fail=1
          done

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "CONTRIBUTING.md section 1: every commit must carry a Signed-off-by line matching its author."
            echo "  a new commit:   git commit -s"
            echo "  a whole branch: git rebase --signoff $base"
            exit 1
          fi
          echo "All $checked commits carry a sign-off matching their author."
