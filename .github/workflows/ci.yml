name: CI

on:
  push:
    branches: [main]
    # Each client versions independently under its own tag namespace: the PS3 port on ps3-v*, the macOS client
    # on macos-v* (docs/macos-plan.md, step 9), the dotnet client on v*. A tag push runs this whole file, so a
    # release passes the same checks as a pull request.
    tags: ['ps3-v*', 'macos-v*', 'v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The real gate: both suites are plain net10.0 and need no console, GPU or native interop. A clean checkout
  # has no captures folder, so the capture-backed vector tests self-skip by design; a skip count that rises
  # unexpectedly means a test stopped finding its fixture.
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      # fetch-depth: 0 because PublishedTreeSweepTests sweeps every commit message, and the suite fails on a
      # shallow clone rather than pass having read one commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test — protocol
        run: dotnet test tests/Ripcord.Protocol.Halyard.Tests/Ripcord.Protocol.Halyard.Tests.csproj -c Release --logger "console;verbosity=normal"
      - name: Test — presentation
        run: dotnet test tests/Ripcord.Presentation.Tests/Ripcord.Presentation.Tests.csproj -c Release --logger "console;verbosity=normal"

  # The full app, including the two C++/WinRT projects, which need MSBuild proper (`dotnet build` cannot
  # build a vcxproj). Both architectures are first-class targets and either can regress alone.
  app:
    name: App (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: microsoft/setup-msbuild@v2
        with:
          # The action defaults to the 32-bit MSBuild.exe, under which any property derived from the process
          # architecture answers x86. These projects are meant to be driven by a 64-bit MSBuild.
          msbuild-architecture: x64
      - name: Build solution
        # -restore: without it every managed project fails NETSDK1004 for want of a project.assets.json.
        #
        # -p:RipcordNativePlatform: a solution build hands -p:Platform only to projects that declare
        # <Platforms>, so on a cross-architecture build (an x64 runner producing ARM64) the AnyCPU managed
        # consumers (Ripcord.Media, Ripcord.Input) would fall back to the machine's architecture in
        # Directory.Build.props and look for their native interop in the wrong output directory.
        run: msbuild Ripcord.slnx -restore -p:Platform=${{ matrix.platform }} -p:RipcordNativePlatform=${{ matrix.platform }} -p:Configuration=Release -m
      - name: Native interop landed where the managed projects look for it
        shell: pwsh
        run: |
          $dir = "${{ matrix.platform }}\Release"
          if (-not (Test-Path $dir)) { throw "native interop output missing: $dir" }
          Get-ChildItem $dir -Recurse -Filter *.dll | Select-Object -First 20 Name, Length

      # The release zip, on a v* tag only. dotnet publish makes it self-contained (Ripcord.App.csproj), so it
      # needs neither .NET nor the Windows App SDK installed, and it carries the licences, the privacy page and
      # GameInputRedist.msi. The checks below fail the job rather than ship a zip missing any of them.
      - name: Publish the release zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # The version comes from the tag: v1.0-rc1 is assembly version 1.0.0 (the numbers only, padded)
          # and informational version 1.0-rc1, which Settings > About shows. Without it every zip would
          # report the project's default version.
          $tag = "$env:GITHUB_REF_NAME".TrimStart('v')
          $numbers = ($tag -split '-')[0].Split('.')
          while ($numbers.Count -lt 3) { $numbers += '0' }
          $version = ($numbers[0..2] -join '.')
          dotnet publish src/Ripcord.App/Ripcord.App.csproj -c Release -p:Platform=${{ matrix.platform }} -p:RipcordNativePlatform=${{ matrix.platform }} -p:Version=$version -p:InformationalVersion=$tag -nodeReuse:false
          $pub = Get-ChildItem src/Ripcord.App/bin/${{ matrix.platform }}/Release -Recurse -Directory -Filter publish | Select-Object -First 1
          if (-not $pub) { throw "no publish folder" }
          foreach ($f in 'Ripcord.exe','LICENSE','NOTICE','THIRD-PARTY-NOTICES.txt','PRIVACY.md','GameInputRedist.msi','coreclr.dll','Microsoft.WindowsAppRuntime.dll') {
            if (-not (Test-Path (Join-Path $pub.FullName $f))) { throw "the publish is missing $f" }
          }
          # Inside a Ripcord folder, so unzipping gives one folder rather than loose files.
          $arch = "${{ matrix.platform }}".ToLowerInvariant()
          $stage = "stage/Ripcord"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$($pub.FullName)/*" $stage -Recurse
          $zip = "ripcord-$env:GITHUB_REF_NAME-win-$arch.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          Get-Item $zip | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: ripcord-windows-${{ matrix.platform }}
          path: ripcord-*-win-*.zip
          if-no-files-found: error

  # Not a support claim: the dotnet client's UI is Windows-only. This guards one rule, that the portable
  # projects stay portable. PresentationPortabilityTests polices assembly references, but a Windows-only
  # *package* would slip past it; compiling the portable set for a non-Windows RID catches that on the
  # commit that causes it.
  portable-core:
    name: Portable core (${{ matrix.rid }})
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        # Linux alone: it proves the portable set builds and runs off Windows, which is the whole claim. No
        # shipping client runs .NET on macOS.
        include:
          - { host: ubuntu-latest, rid: linux-x64 }
    steps:
      # fetch-depth: 0 because PublishedTreeSweepTests sweeps every commit message, and the suite fails on a
      # shallow clone rather than pass having read one commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build the portable projects
        run: |
          for p in \
            src/Ripcord.Core/Ripcord.Core.csproj \
            src/Ripcord.Core.Net/Ripcord.Core.Net.csproj \
            src/Ripcord.Cloud.Halyard/Ripcord.Cloud.Halyard.csproj \
            src/Ripcord.Protocol.Halyard.Common/Ripcord.Protocol.Halyard.Common.csproj \
            src/Ripcord.Protocol.Halyard.Takion/Ripcord.Protocol.Halyard.Takion.csproj \
            src/Ripcord.Protocol.Halyard/Ripcord.Protocol.Halyard.csproj \
            src/Ripcord.Presentation/Ripcord.Presentation.csproj \
            src/Ripcord.Presentation.Halyard/Ripcord.Presentation.Halyard.csproj \
            src/Ripcord.Client/Ripcord.Client.csproj \
            src/Ripcord.Diagnostics/Ripcord.Diagnostics.csproj \
            src/Ripcord.Media.Audio/Ripcord.Media.Audio.csproj \
            src/Ripcord.Input.Common/Ripcord.Input.Common.csproj \
            tools/Ripcord.ProtocolLab/Ripcord.ProtocolLab.csproj ; do
            echo "== $p"
            dotnet build "$p" -c Release -r ${{ matrix.rid }} --self-contained false
          done
      - name: Run both suites on this host
        run: |
          dotnet test tests/Ripcord.Protocol.Halyard.Tests/Ripcord.Protocol.Halyard.Tests.csproj -c Release
          dotnet test tests/Ripcord.Presentation.Tests/Ripcord.Presentation.Tests.csproj -c Release
      # The leak guard's checker, against a synthetic captures folder. CI has no real one, so the hooks do
      # nothing here, and this step is what catches a broken checker.
      - name: The leak guard's checker
        if: runner.os == 'Linux'
        run: python3 tools/leak-guard/test_check.py

  # The portable C core's own gates: the host suite, `make compile`, the sanitizers and the fuzz harnesses.
  # The PS3 job cross-compiles the core but runs none of these.
  #
  # Linux only, where the console ports are built. The engine job's ripcord-diff still builds the core under
  # Apple's clang on macOS.
  libripcord:
    name: libripcord (${{ matrix.host }})
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The known-answer vectors are generated from the .NET reference, never committed.
      - name: Generate the known-answer vectors
        run: dotnet run --project tools/Ripcord.ProtocolLab -c Release -- vectors
      - name: Host suite
        run: make -C libripcord/tests
      - name: Every portable file compiles
        run: make -C libripcord/tests compile
      - name: Host suite under AddressSanitizer and UndefinedBehaviorSanitizer
        run: >-
          make -C libripcord/tests BUILD=build/sanitize
          CFLAGS="-std=c99 -O1 -g -Wall -Wextra -Werror -Wshadow -Wconversion -Wsign-conversion
          -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      - name: Fuzz harnesses, sanitized replay
        run: make -C libripcord/tests fuzz-replay
      - name: Fuzz, coverage-guided
        if: runner.os == 'Linux'
        run: make -C libripcord/tests fuzz-run FUZZ_CC=clang FUZZ_SECONDS=60
      - name: Keep what the fuzzer found
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: libripcord-fuzz-findings
          path: |
            libripcord/tests/build/fuzz/crash-*
            libripcord/tests/build/fuzz/leak-*
            libripcord/tests/build/fuzz/timeout-*
          if-no-files-found: ignore

  # The Rust engine (engine/, docs/engine-plan.md): the whole protocol, which the Apple clients ship on.
  # Four hosts, because each one links the engine differently. The .NET harness runs its checks on each and
  # prints the per-packet cost, which is informational only on a shared runner. Miri and cargo-fuzz run in
  # engine-nightly.yml.
  engine:
    name: Rust engine (${{ matrix.host }})
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable && cargo --version
      # The known-answer vectors are generated from the .NET reference, never committed.
      - name: Generate the known-answer vectors
        run: dotnet run --project tools/Ripcord.ProtocolLab -c Release -- vectors
      # ripcord-diff builds the C core with its own Python constants generator and runs it beside the Rust
      # engine. The C core has never been built with MSVC, so the Windows legs leave that crate out.
      - name: Tests, the vector runner and the differential runs against the C core
        if: runner.os != 'Windows'
        working-directory: engine
        run: cargo test --workspace --release --all-features
      - name: Tests and the vector runner
        if: runner.os == 'Windows'
        working-directory: engine
        run: cargo test --workspace --release --all-features --exclude ripcord-diff
      - name: Clippy and formatting
        working-directory: engine
        shell: bash
        run: |
          exclude=""; [ "$RUNNER_OS" = Windows ] && exclude="--exclude ripcord-diff"
          # Twice: the shipping build, and with the test-support exports on.
          cargo clippy --workspace $exclude --all-targets -- -D warnings
          cargo clippy --workspace $exclude --all-targets --all-features -- -D warnings
          cargo fmt --check
      # cargo-deny from crates.io at a pinned version rather than a third-party action: the registry every
      # engine dependency already comes from, and no second publisher to trust.
      - name: Dependency policy
        if: runner.os == 'Linux'
        working-directory: engine
        run: cargo install cargo-deny --version 0.20.2 --locked && cargo deny --all-features check
      - name: The engine from .NET, through its generated bindings
        run: dotnet run -c Release --project engine/hosts/dotnet/Ripcord.Engine.Harness

  # The macOS client's Xcode project (src/Ripcord.Mac). Its build phase runs cargo, so this job needs a Rust
  # toolchain. RipcordKitTests checks CryptoKit as the engine's key agreement against the .NET vectors
  # (EngineKeyAgreementTests) and runs whole sessions against the engine's loopback consoles.
  #
  # macos-26 because the deployment target is macOS 26 (docs/macos-plan.md), which needs that SDK.
  mac:
    name: macOS client
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Toolchain
        run: >-
          rustup toolchain install stable --profile minimal && rustup default stable
          && rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-tvos aarch64-apple-tvos-sim
          && xcodebuild -version && swift --version && cargo --version
      - name: Generate the known-answer vectors
        run: dotnet run --project tools/Ripcord.ProtocolLab -c Release -- vectors
      - name: Build the lab and the app
        working-directory: src/Ripcord.Mac
        run: |
          for scheme in RipcordLab Ripcord; do
            xcodebuild -project Ripcord.xcodeproj -scheme "$scheme" -configuration Release -derivedDataPath build build
          done
      # The iPhone, iPad and Apple TV app (docs/ios-plan.md). Device builds are unsigned, since those platforms
      # refuse an ad hoc signature; this checks they compile and link, not that they install.
      - name: Build the mobile app for iPhone, iPad and Apple TV
        working-directory: src/Ripcord.Mac
        run: |
          for destination in 'generic/platform=iOS' 'generic/platform=iOS Simulator' 'generic/platform=tvOS'; do
            xcodebuild -project Ripcord.xcodeproj -scheme RipcordMobile -configuration Release \
              -destination "$destination" -derivedDataPath build-mobile build
          done
      - name: RipcordKit tests
        working-directory: src/Ripcord.Mac
        run: >-
          xcodebuild -project Ripcord.xcodeproj -scheme RipcordKit -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build test
      - name: Lab self-check
        run: src/Ripcord.Mac/build/Build/Products/Release/ripcord-lab check
      # The shipping build must carry none of the test-support exports; the dylib is read because Xcode's nm
      # cannot read the static archive's Rust bitcode.
      - name: The shipping engine carries no test exports
        run: >-
          ! nm -gU engine/target/shipping/release/libripcord.dylib
          | grep -E '_ripcord_(kat_run|loopback|scripted|account_seed_seal)'

      # On a macos-v* tag, the same app again, signed with the Developer ID, notarized and stapled. Six secrets:
      #   MACOS_DEVELOPER_ID_P12 (base64) and MACOS_DEVELOPER_ID_P12_PASSWORD: the Developer ID Application
      #     certificate and its key;
      #   MACOS_TEAM_ID;
      #   MACOS_NOTARY_KEY (base64 .p8), MACOS_NOTARY_KEY_ID, MACOS_NOTARY_ISSUER: an App Store Connect API
      #     key for notarytool.
      # The app group stays off (RIPCORD_APP_GROUP = NO): claiming one under a Developer ID needs a
      # provisioning profile as well. The widget then shows the way into the app.
      - name: Sign, notarize and staple (macos-v* tags)
        if: startsWith(github.ref, 'refs/tags/macos-v')
        working-directory: src/Ripcord.Mac
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          set -eu
          for v in P12 P12_PASSWORD TEAM_ID NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER; do
            eval "[ -n \"\${$v}\" ]" || { echo "::error::the $v secret is not set; see the comment above this step"; exit 1; }
          done
          version="${GITHUB_REF_NAME#macos-v}"

          # A keychain of this job's own, holding only the certificate, deleted when the runner is.
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass="$(uuidgen)"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')

          xcodebuild -project Ripcord.xcodeproj -scheme Ripcord -configuration Release -derivedDataPath build-release \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $kc" build
          app=build-release/Build/Products/Release/Ripcord.app
          codesign --verify --deep --strict --verbose=2 "$app"

          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/submit.zip"
          xcrun notarytool submit "$RUNNER_TEMP/submit.zip" --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait
          rm "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose "$app"

          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/Ripcord-macos-v$version.zip"

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/macos-v')
        with:
          name: ripcord-macos-${{ github.ref_name }}
          path: src/Ripcord.Mac/dist/*.zip
          if-no-files-found: error

  # The PS3 port's installable package: a Makefile driving a PowerPC cross-compiler and a second one for the
  # SPEs, outside Ripcord.slnx, so it gets its own job.
  #
  # The package, not just the .self: `make pkg` is what installs from the XMB, and it covers more of the
  # build (make_self_npdrm, the icon, PARAM.SFO and the third-party notices are pkg-only steps).
  # ports/ripcord-ps3/SETUP.md section 6 covers the packaging faults.
  #
  # Not path-filtered, deliberately. This build consumes libripcord/** and
  # src/Ripcord.Protocol.Halyard/Data/halyard-v1-constants.json, so a change under src/ can break it. A
  # per-job `paths:` would also need its own workflow file or a third-party filter action, which this
  # repository does not take.
  ps3-package:
    name: PS3 package
    runs-on: ubuntu-latest
    env:
      # The toolchain this port is verified against. ports/ripcord-ps3/SETUP.md section 2 names the same
      # nightly: bump them together, with a hardware run behind the bump. Pinned because ps3dev cuts
      # nightlies on its own schedule, and a new one must not be what turns this build red.
      PS3DEV_RELEASE: nightly-2026-07-26
      # The archive's SHA-256, as GitHub records it for that release asset. Bump it with PS3DEV_RELEASE:
      # gh api repos/ps3dev/ps3dev/releases/tags/<tag> reports the digest.
      PS3DEV_SHA256: dcbed747e094c6a382dae5b0aacc322a1d4390d9f2849a7d750a96ea398ee8ab
    steps:
      - uses: actions/checkout@v4

      # Nothing in the toolchain depends on this repository, so the release tag is the whole cache key. Kept in
      # $HOME rather than the workspace: the archive is relocatable (SETUP.md section 2), and 577 MB of
      # untracked files should not sit in the checkout.
      - name: Cache the ps3dev toolchain
        id: ps3dev
        uses: actions/cache@v4
        with:
          path: ~/ps3dev
          key: ps3dev-${{ env.PS3DEV_RELEASE }}

      - name: Install the ps3dev toolchain
        if: steps.ps3dev.outputs.cache-hit != 'true'
        run: |
          curl -sSL --retry 3 -o "$RUNNER_TEMP/ps3dev.tar.gz" \
            "https://github.com/ps3dev/ps3dev/releases/download/$PS3DEV_RELEASE/ps3dev-linux-X64.tar.gz"
          echo "$PS3DEV_SHA256  $RUNNER_TEMP/ps3dev.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/ps3dev.tar.gz" -C "$HOME"    # the archive's top level is ps3dev/

      # PSL1GHT is $PS3DEV itself, not $PS3DEV/psl1ght: the archive puts ppu_rules, base_rules and data_rules
      # at the top level beside ppu/ and spu/ (SETUP.md section 2). The Makefiles error on either variable
      # being unset, but not on a wrong directory.
      #
      # PATH is for build-mbedtls.sh, which resolves ${CROSS}gcc with `command -v`; the Makefile addresses
      # the compilers by absolute path.
      - name: Point the build at the toolchain
        run: |
          echo "PS3DEV=$HOME/ps3dev"  >> "$GITHUB_ENV"
          echo "PSL1GHT=$HOME/ps3dev" >> "$GITHUB_ENV"
          printf '%s\n' "$HOME/ps3dev/bin" "$HOME/ps3dev/ppu/bin" "$HOME/ps3dev/spu/bin" >> "$GITHUB_PATH"

      # openh264, Opus and Mbed TLS are fetched from pinned, hash-verified upstream releases and cross-built;
      # none is vendored. The key covers the three scripts and the Mbed TLS config header, the only things in
      # this repository that decide what comes out, plus the toolchain that compiled it.
      - name: Cache the cross-built third-party libraries
        id: thirdparty
        uses: actions/cache@v4
        with:
          path: ports/ripcord-ps3/third-party
          key: ps3-thirdparty-${{ env.PS3DEV_RELEASE }}-${{ hashFiles('ports/ripcord-ps3/tools/build-openh264.sh', 'ports/ripcord-ps3/tools/build-opus.sh', 'libripcord/tools/build-mbedtls.sh', 'libripcord/tools/ripcord-mbedtls-config.h') }}

      # Skipped on a cache hit: build-openh264.sh recompiles everything each time it runs, and the cache key
      # already covers the scripts and the toolchain.
      - name: Cross-build openh264, Opus and Mbed TLS
        if: steps.thirdparty.outputs.cache-hit != 'true'
        working-directory: ports/ripcord-ps3
        run: |
          sh tools/build-openh264.sh
          sh tools/build-opus.sh
          PREFIX="$PWD/third-party/mbedtls" CROSS=powerpc64-ps3-elf- sh ../../libripcord/tools/build-mbedtls.sh

      # The build number is the run number. .buildno is gitignored per-machine state, so a runner starts at
      # zero and every CI package would otherwise call itself b1. The stamp step writes one less than the run
      # number because the rc_build_id.h rule increments what it reads; the XMB version is that number with a
      # dot in it (run 432 -> 04.32). The NN.NN field holds to b9999, and run 10000 is not guarded against.
      #
      # On a tag the package is versioned by the tag and by neither counter. RELEASE_TAG goes into the
      # environment, where the Makefile's `RELEASE_TAG ?=` reads it, and the developer counter is not
      # consumed. The Makefile has the reasoning in full.
      - name: Decide how this build is versioned
        run: |
          case "$GITHUB_REF" in
            refs/tags/ps3-v*)
              echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
              echo "release build, versioned by tag $GITHUB_REF_NAME" ;;
            *)
              echo "ordinary build, versioned by run number ${{ github.run_number }}" ;;
          esac

      - name: Stamp the package with this run's number
        if: env.RELEASE_TAG == ''
        run: echo $(( ${{ github.run_number }} - 1 )) > ports/ripcord-ps3/.buildno

      # Both goals in one invocation, so they share a single rc_build_id.h: `pkg` alone depends on
      # build/ripcord-ps3.ready.elf and never reaches the $(APP).self rule.
      # BUILD_ORIGIN=ci makes the compiled build id "b35ci", so no CI artifact can be mistaken for a developer
      # build: this counter is github.run_number, the developer one a gitignored per-machine file.
      - name: Build the package
        working-directory: ports/ripcord-ps3
        run: make all pkg BUILD_ORIGIN=ci

      # The package must prove it carries the build just made: `make pkg` leaves the previous package in place
      # when it fails, so a stale one would upload cleanly. This is tools/ship.sh's check. The notices check is
      # the other half: a .pkg without them is a licence breach, and the Makefile makes them a prerequisite.
      - name: The package carries the build that was just made
        working-directory: ports/ripcord-ps3
        run: |
          sfo_ver=$(strings build/pkg/PARAM.SFO | grep -oE '^[0-9][0-9]\.[0-9][0-9]$' | head -1)

          if [ -n "$RELEASE_TAG" ]; then
            # A release is checked against its tag: the package must claim the version the tag names.
            # ps3-v1.0 -> 01.00.
            expected=$(printf '%s' "$RELEASE_TAG" \
              | sed -n 's/^ps3-v\([0-9][0-9]*\)\.\([0-9][0-9]*\)$/\1 \2/p' \
              | xargs printf '%02d.%02d')
            if [ -z "$expected" ] || [ "$sfo_ver" != "$expected" ]; then
              echo "::error::tag $RELEASE_TAG wants version $expected but the package says ${sfo_ver:-nothing}"
              exit 1
            fi
            echo "$RELEASE_TAG, version $sfo_ver - EBOOT, icon and notices all present"
          else
            # [a-z]* tolerates the BUILD_ORIGIN suffix this job passes: the id is "b35ci", not "b35".
            # Without it the pattern matches nothing and this gate fails every CI build, reporting a
            # stale package.
            built=$(sed -n 's/.*"b\([0-9]*\)[a-z]*".*/\1/p' build/rc_build_id.h)
            sfo_built=$(printf '%s' "$sfo_ver" | tr -d '.' | sed 's/^0*//')

            if [ -z "$built" ] || [ "$built" != "$sfo_built" ]; then
              echo "::error::compiled b$built but the package's version says ${sfo_ver:-nothing} - the package is stale"
              exit 1
            fi
          fi
          for f in build/pkg/USRDIR/EBOOT.BIN build/pkg/USRDIR/THIRD-PARTY-NOTICES.txt build/pkg/ICON0.PNG; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty in the package staging directory"; exit 1; }
          done
          [ -n "$RELEASE_TAG" ] || echo "b$built, version $sfo_ver - EBOOT, icon and notices all present"
          ls -l ripcord-ps3.gnpdrm.pkg

      # The package and only the package. It installs from the XMB and carries
      # USRDIR/THIRD-PARTY-NOTICES.txt inside itself, where the licences want it for a binary distribution.
      #
      # The .self is not uploaded, for a licence reason: it is a bare executable with no notice text in it,
      # statically linking openh264, Opus, Mbed TLS, PSL1GHT and FreeType, so publishing it would mean
      # publishing the notices beside it. Anyone who wants one runs `make`.
      #
      # The .gnpdrm one rather than the plain .pkg: it is the package_finalize'd build, what tools/ship.sh
      # uploads, what SETUP.md's loop installs, and what has been installed on hardware.
      - uses: actions/upload-artifact@v4
        with:
          name: ripcord-ps3-b${{ github.run_number }}
          path: ports/ripcord-ps3/ripcord-ps3.gnpdrm.pkg
          if-no-files-found: error

  # The PS3 release. Runs only for a ps3-v* tag, and only after the jobs in `needs` have passed.
  #
  # It builds nothing: it publishes the package ps3-package built and verified against the tag, downloaded
  # as that job's artifact, so the bytes a person installs are the bytes the gates saw.
  #
  # A draft, deliberately: a person writes the release notes, saying what this port streams and what it
  # does not, and publishes it.
  ps3-release:
    name: PS3 release
    if: startsWith(github.ref, 'refs/tags/ps3-v')
    # Deliberately not `dco`: it is pull-request-only, so on a tag it is skipped, and a skipped dependency
    # skips its dependents.
    needs: [tests, app, portable-core, ps3-package]
    runs-on: ubuntu-latest
    permissions:
      # The only job in this file that writes anything back. The workflow's default is contents: read.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ripcord-ps3-b${{ github.run_number }}
          path: dist

      # The asset carries the version in its name. The console does not care what the package is called;
      # only EBOOT.BIN's name matters to NPDRM.
      - name: Publish a draft release with the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ${GITHUB_REF_NAME#ps3-} drops the namespace prefix, so ps3-v0.9 gives ripcord-ps3-v0.9.pkg
          # rather than ripcord-ps3-ps3-v0.9.pkg. The prefix only keeps this tag namespace separate
          # from the dotnet client's.
          asset="ripcord-ps3-${GITHUB_REF_NAME#ps3-}.pkg"
          mv dist/ripcord-ps3.gnpdrm.pkg "$asset"
          ls -l "$asset"

          # The notes are a placeholder on purpose: what this port streams, and what it does not, is
          # for a person to write before publishing.
          cat > notes.md <<'NOTES'
          **Draft — release notes go here before publishing.** What this build runs, streams and pairs
          with, and what it does not do.

          The package installs from the XMB. It carries its own third-party notices inside itself at
          `USRDIR/THIRD-PARTY-NOTICES.txt`.
          NOTES
          sed -i 's/^          //' notes.md

          # -R, because this job has no checkout and does not want one. Without it `gh` infers the
          # repository from a git remote and fails with "fatal: not a git repository".
          # Checking out the source only to satisfy that inference would contradict the job
          # building nothing.
          gh release create "$GITHUB_REF_NAME" "$asset" \
            -R "$GITHUB_REPOSITORY" \
            --draft \
            --title "ripcord-ps3 $GITHUB_REF_NAME" \
            --notes-file notes.md

          echo "Draft release $GITHUB_REF_NAME created with $asset attached."
          echo "It is NOT public until somebody publishes it."

  # The dotnet client's release, on the PS3 release's terms (above): only for a v* tag, only after the jobs in
  # `needs` have passed, publishing the two zips the app job built rather than building anything, and as a
  # draft for a person to write the notes on and publish.
  windows-release:
    name: Windows release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, app, portable-core]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ripcord-windows-*
          merge-multiple: true
          path: dist

      - name: Publish a draft release with both zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # Checksums for both zips, attached beside them, so a download can be checked against what CI built.
          (cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          cat > notes.md <<'NOTES'
          **Draft — release notes go here before publishing.** What this build streams, pairs with and runs
          on, and what it does not do yet.

          **Installing.** Download the zip for your PC: `win-x64` for most PCs, `win-arm64` for ARM devices such
          as a Surface Pro X or a Copilot+ PC. Unzip it somewhere it can stay, not Downloads (desktop shortcuts
          and the taskbar's jump list remember where it is), and run `Ripcord.exe` from the `Ripcord` folder.
          Nothing else to install: .NET and the Windows App SDK are inside. `SHA256SUMS.txt` has each
          zip's checksum.

          **Windows will warn you.** Ripcord isn't code-signed yet. SmartScreen shows a warning the first time:
          choose **More info**, then **Run anyway**. If **Smart App Control** is on, which it can be on a new PC
          or a fresh Windows 11 install, Windows blocks unsigned apps outright, with no way to run them anyway;
          Ripcord won't start there until it is signed. Signing is planned.

          **Xbox controllers** need Microsoft's GameInput runtime. If one does nothing, run `GameInputRedist.msi`
          from the same folder once, then restart Ripcord. A DualSense works without it. Settings > About says
          which you have.

          **Upgrading.** Your saved settings, paired consoles and sign-in are kept: a new default applies only to
          a fresh install, and what you chose before stays until you change it.
          NOTES
          sed -i 's/^          //' notes.md
          # A tag with a suffix (v1.0-rc1) is a pre-release, so publishing it never makes it "Latest" over a real
          # release, the PS3 port's ps3-v1.0 among them.
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" \
            --draft "${prerelease[@]}" \
            --title "Ripcord $GITHUB_REF_NAME" \
            --notes-file notes.md
          echo "Draft release $GITHUB_REF_NAME created. It is NOT public until somebody publishes it."

  # The Mac release, on the PS3 release's terms (above): only for a macos-v* tag, only after the jobs in
  # `needs` have passed, publishing the notarized zip the mac job built rather than building anything, and as
  # a draft for a person to write the notes on and publish.
  mac-release:
    name: macOS release
    if: startsWith(github.ref, 'refs/tags/macos-v')
    needs: [tests, app, portable-core, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ripcord-macos-${{ github.ref_name }}
          path: dist

      - name: Publish a draft release with the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          cat > notes.md <<'NOTES'
          **Draft — release notes go here before publishing.** What this build streams, pairs with and runs
          on, and what it does not do yet.

          Signed with a Developer ID and notarized. Unzip and move Ripcord to Applications.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            -R "$GITHUB_REPOSITORY" \
            --draft \
            --title "Ripcord for Mac ${GITHUB_REF_NAME#macos-}" \
            --notes-file notes.md
          echo "Draft release $GITHUB_REF_NAME created. It is NOT public until somebody publishes it."

  # CONTRIBUTING.md section 1 requires every commit to carry a Signed-off-by line matching its author; this
  # job enforces it. A few lines of git rather than a third-party action: this repository takes only
  # first-party actions.
  dco:
    name: DCO sign-off
    # Pull requests only: on a push to main the range worth checking is ambiguous, and the check would be a
    # report rather than a gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0: a shallow clone lacks the commits being judged, and `git rev-list` over a range it
      # cannot see exits 0 having checked nothing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its own author
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'

          # --no-merges: a merge commit introduces no new work to certify, and the one the forge
          # writes cannot have been signed in advance. The DCO is asked of commits that carry
          # authored work.
          commits="$(git rev-list --no-merges "$base..$head")"
          if [ -z "$commits" ]; then
            echo "No non-merge commits in $base..$head - nothing to certify."
            exit 0
          fi

          fail=0
          checked=0
          for sha in $commits; do
            checked=$((checked + 1))
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            signoffs="$(git log -1 --format='%B' "$sha" | sed -n 's/^[Ss]igned-off-by:[[:space:]]*//p' | sed 's/[[:space:]]*$//')"

            # -x and -i: the whole line must be the author, not merely contain them, so a sign-off
            # naming somebody else does not pass simply by being present.
            if echo "$signoffs" | grep -qixF "$author"; then
              continue
            fi

            echo "::error title=Missing or mismatched DCO sign-off::$(git log -1 --format='%h %s' "$sha")"
            echo "    author:    $author"
            echo "    sign-offs: ${signoffs:-(none)}"
            fail=1
          done

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "CONTRIBUTING.md section 1: every commit must carry a Signed-off-by line matching its author."
            echo "  a new commit:   git commit -s"
            echo "  a whole branch: git rebase --signoff $base"
            exit 1
          fi
          echo "All $checked commits carry a sign-off matching their author."
