// bandwidth_probe.proto — the pre-stream bandwidth/MTU probe sub-schema,
// imported by stream_control.proto. The vendor's coined names are renamed; names that are purely the
// plain-English description of a field may be retained as interface labels (see README.md, "What is
// reproduced here"). Field numbers, wire types, enum
// values, and structure are interoperability facts recovered from our own copy of the client binary.
// DO NOT change any field number or enum value; names never appear on the wire.

syntax = "proto2";

package avstream.bandwidth;

message BandwidthProbePayload {
  enum Command {
    ECHO_COMMAND = 0;
    MTU_COMMAND = 1;
    BANDWIDTH_COMMAND = 3;
    CLIENT_MTU_COMMAND = 4;
  }
  required BandwidthProbePayload.Command command = 1;
  optional EchoCommand echoCommand = 2;
  optional MtuCommand mtuCommand = 3;
  optional BandwidthCommand bandwidthCommand = 4;
  optional ClientMtuCommand clientMtuCommand = 5;
}

message EchoCommand {
  required bool state = 1;
}

message MtuCommand {
  required uint32 id = 1;
  required uint32 mtuReq = 2;
  optional uint32 mtuSent = 3;
  optional uint32 num = 4;
  optional uint32 sendDelay = 5;
  optional uint32 delta = 6;
}

message BandwidthCommand {
  required uint32 id = 1;
  required uint32 time = 2;
  optional uint32 bandwidth = 3;
  optional uint32 fps = 4;
  optional uint32 mtu = 5;
  optional uint32 naluCount = 6;
  optional uint32 totalSent = 7;
  optional bool upstream = 8;
  optional double loss = 9;
}

message ClientMtuCommand {
  required uint32 id = 1;
  required uint32 mtuReq = 2;
  required bool state = 3;
  optional uint32 mtuDown = 4;
}
