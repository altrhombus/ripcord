			);
			name = "Build the Rust engine";
			outputFileListPaths = (
			);
			outputPaths = (
				"$(RIPCORD_ENGINE)/target/include/ripcord.h",
				"$(RIPCORD_ENGINE)/target/shipping/release/libripcord.a",
				"$(RIPCORD_ENGINE)/target/release/libripcord.a",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# The Rust engine (docs/engine-plan.md): the Mac's protocol engine since Phase 3. Built twice, and\n# cargo is incremental, so this is quick when nothing changed: the shipping library, with no test-support,\n# into target/shipping (what the lab links, and what an app target will), and the test library, with the\n# loopback consoles and the vector runner, into target (what RipcordKitTests links). Both write the same\n# ripcord.h, which CRipcordEngine's module map reads in place; the test exports in it are behind\n# RIPCORD_TEST_SUPPORT.\nset -eu\nexport PATH=\"${HOME}/.cargo/bin:/opt/homebrew/opt/rustup/bin:/usr/local/opt/rustup/bin:${PATH}\"\nunset CARGO_TARGET_DIR\ncd \"${RIPCORD_ENGINE}\"\ncargo build --release -p ripcord-ffi --target-dir target/shipping\ncargo build --release -p ripcord-ffi --features test-support\n";
		};
