<!--
  Ripcord app tile, small cut — a separate drawing for 32 px and below, not a scaled-down copy of the master.
  Every coordinate is a multiple of 4, so at 16 px (1 px = 4 units) every edge lands on a pixel boundary:
  dashes are 2 px tall with 1 px gaps, and the wedge is sharp-cornered because 1 px of rounding is invisible
  at this size but costs a soft edge.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23272E" />
      <stop offset="1" stop-color="#12151A" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#tile)" />
  <path d="M36 16L56 32L36 48Z" fill="#FFFFFF" />
  <rect x="20" y="16" width="8" height="8" rx="4" fill="#2FBF5B" />
  <rect x="12" y="28" width="16" height="8" rx="4" fill="#2D7DF6" />
  <rect x="16" y="40" width="12" height="8" rx="4" fill="#F0433A" />
</svg>
