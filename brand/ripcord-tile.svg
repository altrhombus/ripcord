<!--
  Ripcord app tile — the primary mark. A play wedge with three trailing dashes, one per console family.
  64-unit box; the mark is scaled to 72% and centred so it survives Android's adaptive-icon crop.
  Do not edit rendered PNGs; edit this and run brand/generate-assets.ps1.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23272E" />
      <stop offset="1" stop-color="#12151A" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)" />
  <g transform="translate(32,32) scale(0.72) translate(-30.5,-32)">
    <path d="M29 17L53 32L29 47Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" />
    <rect x="12" y="18" width="9" height="7" rx="3.5" fill="#2FBF5B" />
    <rect x="5" y="28.5" width="16" height="7" rx="3.5" fill="#2D7DF6" />
    <rect x="9" y="39" width="12" height="7" rx="3.5" fill="#F0433A" />
  </g>
</svg>
