[package]
name = "ripcord-diff"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Differential tests: the Rust engine against the C core, same inputs, compared outputs"

# Test tooling only: never linked into a host. It calls the C core, so it is the one crate besides
# ripcord-ffi that uses unsafe, and only in src/lib.rs's thin wrappers over shim/diff_shim.c.

[dependencies]
ripcord-proto = { path = "../ripcord-proto" }

[build-dependencies]
cc = "1"
