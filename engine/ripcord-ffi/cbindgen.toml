# The generated header is the ABI. Nobody writes or edits ripcord.h by hand (docs/engine-plan.md, rule 1).
language = "C"
cpp_compat = true
include_guard = "RIPCORD_H"
header = "/* ripcord.h - the Rust engine's C ABI. GENERATED by cbindgen from engine/ripcord-ffi; do not edit. */"
usize_is_size_t = true
style = "type"
documentation_style = "c99"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
prefix = ""
# Named by ripcord_struct_size's documentation rather than its signature, which takes a plain integer.
include = ["RipcordStructId"]

[defines]
"feature = test-support" = "RIPCORD_TEST_SUPPORT"
